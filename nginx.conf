# Custom Nginx server block for CampusConnect
server {
    # Listen on port 80 INSIDE the container
    listen 80;
    server_name localhost;

    # Folder where the website files were copied by the Dockerfile
    root /usr/share/nginx/html;

    # Default file shown for "/"
    index index.html;

    # Never show a list of files in a folder
    autoindex off;

    # Try the exact file, then a folder index, otherwise return 404
    location / {
        try_files $uri $uri/ =404;
    }

    # Show our own page for "not found" (404) and "forbidden" (403, e.g. folders)
    # "=404" keeps the HTTP status code as 404.
    error_page 403 =404 /404.html;
    error_page 404 /404.html;

    # Serve 404.html as a normal file (no redirect, so no redirect loop)
    location = /404.html {
        try_files $uri =404;
    }
}
